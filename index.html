<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DART Mail</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/mail.css">
</head>
<body>
  <section id="gate" class="gate">
    <div class="gate-card">
      <p class="mark">DART Mail</p>
      <form id="signin-form">
        <label for="email">Email
          <input id="email" name="username" type="email" autocomplete="username" placeholder="Email" required>
        </label>
        <button class="primary" type="submit">Continue</button>
      </form>
      <p class="hint">Microsoft asks for the password on the next page. This page does not keep it.</p>
      <p id="gate-error" class="error" role="alert"></p>
    </div>
  </section>

  <div id="shell" class="shell" hidden>
    <header class="top">
      <div class="brand">DART Mail</div>
      <form id="search-form" class="search" role="search">
        <input id="search" type="search" placeholder="Search mail" aria-label="Search mail">
      </form>
      <div class="top-actions">
        <button type="button" class="avatar" id="avatar" title="Picture" hidden></button>
        <span id="who" class="who"></span>
        <button id="sync" type="button">Sync</button>
        <button id="compose-open" class="primary" type="button">Compose</button>
        <button id="signout" type="button">Sign out</button>
      </div>
    </header>
    <div class="workspace">
      <nav id="folders" class="folders" aria-label="Folders"></nav>
      <section id="list" class="list" aria-label="Messages"></section>
      <article id="reader" class="reader" aria-live="polite"></article>
    </div>
    <footer class="status"><span id="status"></span></footer>
  </div>

  <dialog id="compose">
    <form id="compose-form" method="dialog">
      <header>
        <h2 id="compose-title">New message</h2>
        <button type="button" id="compose-close" aria-label="Close">Close</button>
      </header>
      <label>To <input id="compose-to" autocomplete="email"></label>
      <label>Cc <input id="compose-cc"></label>
      <label>Subject <input id="compose-subject"></label>
      <textarea id="compose-body" rows="12" placeholder="Write"></textarea>
      <footer>
        <button type="button" id="compose-cancel">Cancel</button>
        <button type="submit" class="primary" id="compose-send">Send</button>
      </footer>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
